<!-- @dsCard group="Yön A2 — Panel" -->
<!doctype html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yön A2 — Panel</title>
<style>
/* ============ TEMA ============ */
:root{
  --bg:#0B0E13; --panel:#111520; --raised:#161B27; --hover:#1B2130;
  --line:#232A38; --line-soft:#1B212C;
  --fg:#E8EBF2; --fg-dim:#98A2B8; --fg-mute:#616C82;
  --long:#3BD68F; --short:#FF6070; --warn:#F2B544; --brand:#5B8CFF;
  --long-bg:rgba(59,214,143,.12); --short-bg:rgba(255,96,112,.12);
  --brand-bg:rgba(91,140,255,.12);
  --shadow:0 18px 44px -22px rgba(0,0,0,.9);
  --grid:#1C2330;
}
:root[data-theme="light"]{
  --bg:#F4F6FA; --panel:#FFFFFF; --raised:#FFFFFF; --hover:#F0F3F9;
  --line:#E2E7F0; --line-soft:#EDF1F7;
  --fg:#121722; --fg-dim:#5A6479; --fg-mute:#8A94A8;
  --long:#0F9D63; --short:#DC3545; --warn:#B87A0A; --brand:#3366E0;
  --long-bg:rgba(15,157,99,.10); --short-bg:rgba(220,53,69,.09);
  --brand-bg:rgba(51,102,224,.09);
  --shadow:0 12px 32px -18px rgba(20,30,60,.28);
  --grid:#EEF1F7;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--fg);overflow:hidden;
  font-family:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;
  transition:background .25s ease,color .25s ease;
}
button{font:inherit;color:inherit;cursor:pointer}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--fg-mute);background-clip:content-box}

/* ============ UYGULAMA IZGARASI ============ */
.app{height:100%;display:grid;
  grid-template-columns:236px minmax(0,1fr) 400px;
  grid-template-rows:58px minmax(0,1fr) 32px}
@media(max-width:1240px){.app{grid-template-columns:64px minmax(0,1fr) 340px}
  .side .lbl,.side h3{display:none}.side .nav b{margin:0}}
@media(max-width:980px){.app{grid-template-columns:64px minmax(0,1fr)}.detail{display:none}}

/* ---- üst bar ---- */
.top{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 16px;
  background:var(--panel);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:9px;font-weight:650;letter-spacing:-.02em;font-size:15px;width:206px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--long);box-shadow:0 0 0 4px var(--long-bg)}
@media(max-width:1240px){.logo{width:auto}.logo span:last-child{display:none}}

.search{flex:1;max-width:520px;position:relative}
.search input{width:100%;height:36px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg);color:var(--fg);padding:0 76px 0 34px;font-size:13.5px;outline:none;
  transition:border-color .15s,box-shadow .15s}
.search input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-bg)}
.search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--fg-mute);font-size:13px}
.kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);display:flex;gap:3px}
.kbd i{font-style:normal;font-size:10px;padding:2px 5px;border-radius:5px;background:var(--raised);
  border:1px solid var(--line);color:var(--fg-mute)}
.top .sp{flex:1}
.mkt{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--fg-dim);
  padding:5px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--line)}
.mkt s{width:6px;height:6px;border-radius:50%;text-decoration:none}
.on{background:var(--long)} .off{background:var(--fg-mute)}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--bg);
  display:grid;place-items:center;font-size:15px;transition:background .15s}
.iconbtn:hover{background:var(--hover)}
.primary{height:36px;padding:0 14px;border-radius:10px;border:0;background:var(--brand);color:#fff;
  font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px}
.primary:hover{filter:brightness(1.08)}

/* ---- sol kenar ---- */
.side{background:var(--panel);border-right:1px solid var(--line);padding:14px 10px;
  overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.side h3{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--fg-mute);
  margin:16px 0 6px;padding:0 8px;font-weight:650}
.side h3:first-child{margin-top:0}
.nav{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;
  border:1px solid transparent;background:transparent;width:100%;text-align:left;font-size:13.5px;
  color:var(--fg-dim);transition:background .14s,color .14s}
.nav b{width:18px;text-align:center;font-weight:400;font-size:15px}
.nav:hover{background:var(--hover);color:var(--fg)}
.nav.act{background:var(--brand-bg);color:var(--brand);font-weight:600}
.nav .count{margin-left:auto;font-size:11px;padding:1px 7px;border-radius:99px;
  background:var(--raised);border:1px solid var(--line);color:var(--fg-mute);font-weight:500}
.nav.act .count{background:var(--brand);border-color:var(--brand);color:#fff}

/* ---- orta: liste ---- */
.work{min-width:0;display:flex;flex-direction:column;background:var(--bg)}
.whead{display:flex;align-items:center;gap:10px;padding:16px 22px 12px}
.whead h1{margin:0;font-size:19px;letter-spacing:-.025em;font-weight:650}
.whead p{margin:2px 0 0;font-size:12.5px;color:var(--fg-mute)}
.seg{margin-left:auto;display:flex;background:var(--panel);border:1px solid var(--line);
  border-radius:9px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;color:var(--fg-dim);font-size:12.5px;padding:5px 11px;
  border-radius:7px;transition:background .14s,color .14s}
.seg button.act{background:var(--raised);color:var(--fg);box-shadow:var(--shadow)}
:root[data-theme="light"] .seg button.act{background:var(--brand-bg);color:var(--brand)}

.list{flex:1;overflow-y:auto;padding:4px 16px 20px}
.row{display:grid;grid-template-columns:132px 1fr 96px 92px 74px 34px;align-items:center;gap:14px;
  padding:15px 14px;border-radius:13px;border:1px solid transparent;cursor:pointer;
  transition:background .14s,border-color .14s,transform .14s}
.row+.row{margin-top:3px}
/* Dar pencerede: sparkline ve bildirim rozeti düşer, karar bilgisi kalır */
@media(max-width:1180px){
  .row{grid-template-columns:112px minmax(0,1fr) auto auto;gap:12px;padding:13px 12px}
  .row>div:nth-child(3),.row>div:nth-child(6){display:none}
}
.row:hover{background:var(--panel);border-color:var(--line)}
.row.sel{background:var(--panel);border-color:var(--brand);box-shadow:var(--shadow)}
.tk{font-size:14.5px;font-weight:650;letter-spacing:-.015em}
.tk small{display:block;font-size:11.5px;color:var(--fg-mute);font-weight:450;margin-top:2px}
.pat{font-size:13.5px}
.pat small{display:block;font-size:11.5px;color:var(--fg-mute);margin-top:2px}
.spark{height:34px}
.dirchip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:650;
  padding:3px 8px;border-radius:7px}
.l{color:var(--long);background:var(--long-bg)} .s{color:var(--short);background:var(--short-bg)}
.scorecell{text-align:right}
.scorecell b{font-size:16px;font-weight:650;letter-spacing:-.01em}
.scorecell span{display:block;font-size:11px;color:var(--fg-mute);margin-top:2px}
.bell{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:12px}
.sent{background:var(--long-bg);color:var(--long)}
.mute{background:var(--raised);color:var(--fg-mute)}

/* ---- sağ: detay ---- */
.detail{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;
  display:flex;flex-direction:column}
.dhead{padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.dhead .r1{display:flex;align-items:flex-start;gap:10px}
.dhead h2{margin:0;font-size:23px;letter-spacing:-.03em;font-weight:660}
.dhead p{margin:3px 0 0;font-size:12.5px;color:var(--fg-dim)}
.dscore{margin-left:auto;text-align:right}
.dscore b{display:block;font-size:29px;font-weight:660;letter-spacing:-.02em;line-height:1}
.dscore span{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-mute)}
.sec{padding:16px 20px;border-bottom:1px solid var(--line-soft)}
.sec h4{margin:0 0 11px;font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--fg-mute);font-weight:650}
#chart{display:block;width:100%;height:150px;border-radius:10px;background:var(--bg)}
.bd{display:grid;gap:9px}
.bdrow{display:grid;grid-template-columns:96px 1fr 46px;align-items:center;gap:10px;font-size:12px}
.bdrow span{color:var(--fg-dim)}
.trk{height:6px;border-radius:99px;background:var(--raised);overflow:hidden}
.trk i{display:block;height:100%;border-radius:99px;transform-origin:left}
.bdrow b{text-align:right;font-size:12px}
.newsitem{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.newsitem:last-child{border:0;padding-bottom:0}
.src{font-size:9.5px;font-weight:700;letter-spacing:.06em;padding:2px 6px;border-radius:5px;
  background:var(--brand-bg);color:var(--brand);flex:none;margin-top:1px}
.newsitem p{margin:0;font-size:12.5px;line-height:1.5}
.newsitem em{font-style:normal;font-size:11px;color:var(--fg-mute);display:block;margin-top:3px}
.acts{margin-top:auto;padding:14px 20px;display:grid;grid-template-columns:1fr 1fr;gap:8px;
  border-top:1px solid var(--line)}
.ghost{height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:13px;font-weight:550}
.ghost:hover{background:var(--hover)}

/* ---- alt durum çubuğu ---- */
.status{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:0 16px;font-size:11.5px;
  color:var(--fg-mute);background:var(--panel);border-top:1px solid var(--line)}
.status .sp{flex:1}
.status b{color:var(--fg-dim);font-weight:550}

/* ---- komut paleti ---- */
.overlay{position:fixed;inset:0;background:rgba(4,6,10,.55);backdrop-filter:blur(3px);
  display:none;align-items:flex-start;justify-content:center;padding-top:14vh;z-index:100}
.overlay.open{display:flex;animation:fadein .14s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.palette{width:min(600px,92vw);background:var(--panel);border:1px solid var(--line);
  border-radius:16px;box-shadow:0 40px 80px -30px rgba(0,0,0,.7);overflow:hidden;
  animation:rise .18s cubic-bezier(.16,1,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(-10px) scale(.985)}to{opacity:1;transform:none}}
.palette input{width:100%;height:52px;border:0;border-bottom:1px solid var(--line);background:transparent;
  color:var(--fg);padding:0 18px;font-size:15px;outline:none}
.presults{max-height:340px;overflow-y:auto;padding:8px}
.pgroup{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-mute);
  padding:8px 10px 4px;font-weight:650}
.pitem{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;font-size:13.5px}
.pitem:hover,.pitem.hi{background:var(--hover)}
.pitem b{width:20px;text-align:center;font-weight:400;color:var(--fg-mute)}
.pitem .tail{margin-left:auto;font-size:11px;color:var(--fg-mute)}
.empty{padding:26px;text-align:center;color:var(--fg-mute);font-size:13px}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="app">

  <!-- ÜST BAR -->
  <header class="top">
    <div class="logo"><span class="dot"></span><span>Command Center</span></div>
    <div class="search">
      <span class="ic">⌕</span>
      <input id="q" placeholder="Sembol, formasyon veya haber ara…">
      <span class="kbd"><i>Ctrl</i><i>K</i></span>
    </div>
    <div class="sp"></div>
    <span class="mkt"><s class="on"></s> BIST 16:42</span>
    <span class="mkt"><s class="off"></s> NASDAQ kapalı</span>
    <button class="iconbtn" id="theme" title="Tema değiştir">◐</button>
    <button class="primary">⟳ Tara</button>
  </header>

  <!-- SOL KENAR -->
  <nav class="side">
    <h3 class="lbl">Çalışma alanı</h3>
    <button class="nav act"><b>◈</b><span class="lbl">Sinyaller</span><span class="count">9</span></button>
    <button class="nav"><b>☰</b><span class="lbl">İzleme listesi</span><span class="count">6</span></button>
    <button class="nav"><b>✉</b><span class="lbl">Haberler</span><span class="count">9</span></button>
    <button class="nav"><b>◔</b><span class="lbl">Sistem</span></button>

    <h3 class="lbl">Hızlı filtreler</h3>
    <button class="nav"><b>★</b><span class="lbl">Yüksek skor</span><span class="count">3</span></button>
    <button class="nav"><b>▲</b><span class="lbl">Yalnız LONG</span><span class="count">4</span></button>
    <button class="nav"><b>◉</b><span class="lbl">Bildirilenler</span><span class="count">3</span></button>
    <button class="nav"><b>◷</b><span class="lbl">Son 1 saat</span><span class="count">5</span></button>

    <h3 class="lbl">Piyasa</h3>
    <button class="nav"><b>₺</b><span class="lbl">BIST</span><span class="count">5</span></button>
    <button class="nav"><b>$</b><span class="lbl">NASDAQ</span><span class="count">4</span></button>
  </nav>

  <!-- ORTA -->
  <section class="work">
    <div class="whead">
      <div>
        <h1>Sinyaller</h1>
        <p>Son tarama 12 dakika önce · 6 sembol</p>
      </div>
      <div class="seg">
        <button class="act">Tümü</button><button>Açık</button><button>Bildirilen</button>
      </div>
    </div>
    <div class="list" id="list"></div>
  </section>

  <!-- SAĞ DETAY -->
  <aside class="detail" id="detail"></aside>

  <!-- DURUM -->
  <footer class="status">
    <span>Scheduler <b>çalışıyor</b></span>
    <span>Sonraki tarama <b>17:05</b></span>
    <span>Haber yoklaması <b>4 dk sonra</b></span>
    <span class="sp"></span>
    <span>Telegram <b>bağlı</b></span>
    <span>Gemini <b>bağlı</b></span>
    <span>v0.5 · 148 test</span>
  </footer>
</div>

<!-- KOMUT PALETİ -->
<div class="overlay" id="ov">
  <div class="palette">
    <input id="pq" placeholder="Sembol, komut veya sayfa yaz…">
    <div class="presults" id="pres"></div>
  </div>
</div>

<script>
const SIGNALS=[
 {t:"GARAN.IS",m:"BIST",p:"Yükselen Üçgen",d:"LONG",s:.74,c:.83,px:"141.20",age:"12 dk",n:1,
  spark:[58,54,56,44,47,36,38,26,29,16,10],ind:.41,sent:.52,
  news:[["KAP","Temettü dağıtım kararı açıklandı","+0.52 olumlu"]]},
 {t:"KCHOL.IS",m:"BIST",p:"Ters Omuz Baş Omuz",d:"LONG",s:.71,c:.77,px:"187.40",age:"31 dk",n:1,
  spark:[30,46,38,60,44,64,42,52,30,22,14],ind:.28,sent:.19,
  news:[["KAP","Bağlı ortaklık pay devri tamamlandı","+0.19 olumlu"]]},
 {t:"GOOGL",m:"NASDAQ",p:"Çift Dip",d:"LONG",s:.70,c:.79,px:"208.10",age:"33 dk",n:1,
  spark:[24,44,62,46,40,60,44,28,22,18,14],ind:.33,sent:.05,
  news:[["SEC","8-K · Genel kurul oylama sonuçları","+0.05 nötr"]]},
 {t:"ASELS.IS",m:"BIST",p:"Alçalan Üçgen",d:"SHORT",s:.64,c:.79,px:"92.85",age:"4 sa",n:0,
  spark:[14,28,20,38,30,46,38,54,48,60,58],ind:-.22,sent:-.10,
  news:[["KAP","Yeni iş ilişkisi bildirimi","−0.10 nötr"]]},
 {t:"EREGL.IS",m:"BIST",p:"Çift Tepe",d:"SHORT",s:.58,c:.65,px:"28.94",age:"35 dk",n:0,
  spark:[50,26,12,30,36,14,30,48,58,60,64],ind:-.15,sent:0,news:[]},
 {t:"AMD",m:"NASDAQ",p:"Ters Omuz Baş Omuz",d:"LONG",s:.57,c:.63,px:"164.55",age:"36 dk",n:0,
  spark:[34,50,42,62,48,66,46,54,36,32,26],ind:.12,sent:0,news:[]},
];
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const col=s=>s>=.7?"var(--long)":s>=.6?"var(--warn)":"var(--fg-dim)";
let cur=0;

function sparkSVG(pts,dir){
  const d=pts.map((v,i)=>`${i*(400/(pts.length-1))},${v}`).join(" ");
  return `<svg class="spark" viewBox="0 0 400 74" preserveAspectRatio="none" width="100%">
    <polyline points="${d}" fill="none" stroke="${dir==='LONG'?'var(--long)':'var(--short)'}"
      stroke-width="3" stroke-linejoin="round"/></svg>`;
}

function renderList(){
  document.getElementById('list').innerHTML=SIGNALS.map((g,i)=>`
    <div class="row ${i===cur?'sel':''}" data-i="${i}">
      <div><span class="tk">${g.t}<small>${g.m} · 1h</small></span></div>
      <div class="pat">${g.p}<small>${g.age} önce</small></div>
      <div>${sparkSVG(g.spark,g.d)}</div>
      <div><span class="dirchip ${g.d==='LONG'?'l':'s'}">${g.d==='LONG'?'▲':'▼'} ${g.d}</span></div>
      <div class="scorecell"><b style="color:${col(g.s)}">${g.s.toFixed(2)}</b><span>güven %${Math.round(g.c*100)}</span></div>
      <div><span class="bell ${g.n?'sent':'mute'}">${g.n?'◉':'○'}</span></div>
    </div>`).join('');
  document.querySelectorAll('.row').forEach(r=>r.onclick=()=>{cur=+r.dataset.i;renderList();renderDetail();});
}

function bar(label,val,max,color){
  return `<div class="bdrow"><span>${label}</span>
    <div class="trk"><i style="width:${Math.round(Math.abs(val)/max*100)}%;background:${color}"></i></div>
    <b>${val>0?'+':''}${val.toFixed(2)}</b></div>`;
}

function renderDetail(){
  const g=SIGNALS[cur];
  document.getElementById('detail').innerHTML=`
    <div class="dhead">
      <div class="r1">
        <div><h2>${g.t}</h2><p>${g.p} · ${g.d} · 1h mum · ${g.age} önce</p></div>
        <div class="dscore"><b style="color:${col(g.s)}">${g.s.toFixed(2)}</b><span>final skor</span></div>
      </div>
    </div>
    <div class="sec"><h4>Fiyat · son 60 mum</h4><canvas id="chart" width="760" height="300"></canvas></div>
    <div class="sec"><h4>Skor bileşenleri</h4><div class="bd">
      ${bar('Formasyon',g.c,1,'var(--brand)')}
      ${bar('İndikatör',g.ind,1,g.ind>=0?'var(--long)':'var(--short)')}
      ${bar('Haber',g.sent,1,g.sent>=0?'var(--long)':'var(--short)')}
    </div></div>
    <div class="sec"><h4>Bağlam</h4>
      ${g.news.length?g.news.map(n=>`<div class="newsitem"><span class="src">${n[0]}</span>
        <p>${n[1]}<em>${n[2]}</em></p></div>`).join(''):
        '<p style="margin:0;font-size:12.5px;color:var(--fg-mute)">Bu sembol için son 24 saatte bildirim yok.</p>'}
    </div>
    <div class="acts"><button class="ghost">Grafiği büyüt</button><button class="ghost">Sabitle</button></div>`;
  drawChart(g);
}

function drawChart(g){
  const cv=document.getElementById('chart');if(!cv)return;
  const ctx=cv.getContext('2d'),W=cv.width,H=cv.height,N=60,pad=10;
  let s=g.t.length*97+13;const rnd=()=>(s=(s*16807)%2147483647)/2147483647;
  const up=g.d==='LONG',bars=[];let px=100;
  for(let i=0;i<N;i++){const o=px,c=o+(rnd()-.45)*2.6+(up?i/N*1.4:-i/N*1.2);
    bars.push({o,c,h:Math.max(o,c)+rnd()*1.3,l:Math.min(o,c)-rnd()*1.3});px=c;}
  const hi=Math.max(...bars.map(b=>b.h)),lo=Math.min(...bars.map(b=>b.l));
  const y=v=>pad+(hi-v)/(hi-lo)*(H-pad*2),bw=(W-pad*2)/N;
  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle=css('--grid');ctx.lineWidth=1;
  for(let i=0;i<4;i++){const yy=pad+i*(H-pad*2)/3;ctx.beginPath();ctx.moveTo(pad,yy);ctx.lineTo(W-pad,yy);ctx.stroke();}
  const gU=css('--long'),gD=css('--short');
  bars.forEach((b,i)=>{const x=pad+i*bw+bw/2,u=b.c>=b.o;
    ctx.strokeStyle=ctx.fillStyle=u?gU:gD;ctx.lineWidth=1.4;
    ctx.beginPath();ctx.moveTo(x,y(b.h));ctx.lineTo(x,y(b.l));ctx.stroke();
    ctx.fillRect(x-bw*.32,y(Math.max(b.o,b.c)),bw*.64,Math.max(1.5,Math.abs(y(b.o)-y(b.c))));});
  ctx.setLineDash([5,4]);ctx.strokeStyle=css('--brand');ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(pad+bw*20,y(up?hi-.8:lo+.8));ctx.lineTo(W-pad,y(up?hi-.8:lo+.8));ctx.stroke();
  ctx.setLineDash([]);
}

/* tema */
const root=document.documentElement,tb=document.getElementById('theme');
tb.onclick=()=>{root.dataset.theme=root.dataset.theme==='dark'?'light':'dark';
  tb.textContent=root.dataset.theme==='dark'?'◐':'◑';drawChart(SIGNALS[cur]);};

/* komut paleti */
const ov=document.getElementById('ov'),pq=document.getElementById('pq'),pres=document.getElementById('pres');
const CMDS=[["Sayfa","◈","Sinyaller","g s"],["Sayfa","☰","İzleme listesi","g i"],
  ["Sayfa","✉","Haberler","g h"],["Sayfa","◔","Sistem","g y"],
  ["Komut","⟳","Taramayı başlat","⏎"],["Komut","✉","Haber yoklaması","⏎"],
  ["Komut","◐","Temayı değiştir","⏎"],["Komut","★","Skor eşiğini ayarla","⏎"]];
function paint(f=""){
  const q=f.toLowerCase();
  const sig=SIGNALS.filter(s=>(s.t+s.p).toLowerCase().includes(q))
    .map(s=>`<div class="pitem"><b>${s.d==='LONG'?'▲':'▼'}</b>${s.t} — ${s.p}
      <span class="tail">${s.s.toFixed(2)}</span></div>`);
  const cmd=CMDS.filter(c=>c[2].toLowerCase().includes(q))
    .map(c=>`<div class="pitem"><b>${c[1]}</b>${c[2]}<span class="tail">${c[3]}</span></div>`);
  pres.innerHTML=(sig.length?`<div class="pgroup">Sinyaller</div>${sig.join('')}`:'')
    +(cmd.length?`<div class="pgroup">Komutlar</div>${cmd.join('')}`:'')
    ||`<div class="empty">"${f}" için sonuç yok</div>`;
  const first=pres.querySelector('.pitem');if(first)first.classList.add('hi');
}
function open(){ov.classList.add('open');pq.value="";paint();pq.focus();}
function close(){ov.classList.remove('open')}
document.getElementById('q').onfocus=open;
pq.oninput=e=>paint(e.target.value);
ov.onclick=e=>{if(e.target===ov)close()};
addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();open();}
  if(e.key==='Escape')close();
  if(!ov.classList.contains('open')&&(e.key==='j'||e.key==='k')){
    cur=Math.min(SIGNALS.length-1,Math.max(0,cur+(e.key==='j'?1:-1)));renderList();renderDetail();}
});

renderList();renderDetail();
</script>
