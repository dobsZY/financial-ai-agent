# Arac yapilandirmasi (ROADMAP 5.6). Paketleme yapilmaz; venv + requirements.txt (ADR-12).

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "training/runs", "database/migrations/versions"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
exclude = "(^\\.venv|training/runs|database/migrations)"

[tool.coverage.run]
branch = true
source = ["ai_modules", "api", "config", "core", "database", "notifications", "schemas", "scrapers", "ui"]
omit = ["*/migrations/*", "ui/main_app.py"]

[tool.coverage.report]
fail_under = 70
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
